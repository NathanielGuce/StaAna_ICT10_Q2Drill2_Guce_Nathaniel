<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
</head>
<style>
    .output {
        margin-top: 1rem;
        padding: 1rem;
        border: 1px solid #e9ecef;
        border-radius: 0.5rem;
        background-color: #f8f9fa;
    }
    .form-container {
        margin-top: 2rem;
    }
    py-terminal {
        display: none;
    }
</style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Drill 2</a>
        </div>
    </nav>
    <div class="container mt-4" id="form-container">
        <h3>Input your name to join the best club in the galaxy</h3>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="Fname" placeholder="Enter your first name">
            </div>
            <div class="mb-3">
                <label for="section" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="Lname" placeholder="Enter your last name">
            </div>
            <button type="button" class="btn btn-primary" py-click="submit_form" value="Submit">Submit</button>
        </form>
    <div class="container mt-4" id="output-container">
        <div class="output" id="output-content">        
            Your name and fellow club members will be displayed here after you submit the form.
        </div>
        <div class="output" id="total-members">
        </div>
    </div>
    <py-script src="main.py"></py-script>
</body>
</html>
